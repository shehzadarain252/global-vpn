name: Extract project files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List zip contents
        run: unzip -l global-vpn-project.zip
      - name: Extract project files
        run: |
          set -e
          unzip -o global-vpn-project.zip -d .unzip_tmp
          count=$(ls -A .unzip_tmp | wc -l)
          first=$(ls -A .unzip_tmp | head -n 1)
          src=.unzip_tmp
          if [ "$count" -eq 1 ] && [ -d ".unzip_tmp/$first" ]; then
            src=".unzip_tmp/$first"
          fi
          cp -a "$src"/. ./
          rm -rf .unzip_tmp global-vpn-project.zip .github/workflows/unzip.yml
          echo "Extracted files:"
          find . -type f -not -path './.git/*' | sort
          echo "File count:"
          find . -type f -not -path './.git/*' | wc -l
      - name: Show Android workflow file
        run: |
          echo "===== .github/workflows/android.yml ====="
          cat .github/workflows/android.yml
          echo "===== end android.yml ====="
      - name: Commit extracted files
        run: |
          git config user.name "shehzadarain252"
          git config user.email "shehzadarain261@gmail.com"
          git add -A -- ':!.github/workflows/android.yml'
          git status --short
          git commit -m "Upload Global VPN project files" || echo "Nothing to commit"
          git push

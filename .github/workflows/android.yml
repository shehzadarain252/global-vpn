# Builds a debug APK in the cloud on every push to main.
# (Local VM Gradle builds do not work in the dev sandbox — localhost TCP
# is broken there — so the APK is built here, exactly like EduMind AI.)
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Firebase config is never committed. CI builds with a placeholder
      # google-services.json so the build succeeds; a real build needs
      # the real file from the Firebase project (see README.md).
      - name: Placeholder google-services.json (CI only)
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
